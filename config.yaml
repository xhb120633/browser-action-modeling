# Paths are relative to this YAML file.
model:
  path: models/Qwen2.5-VL-3B-Instruct
  torch_dtype: bfloat16
  attn_implementation: sdpa
  min_image_tokens: 64
  max_image_tokens: 512
  use_fast_processor: false

data:
  directory: data/processed
  unit: trajectory                 # trajectory or action
  train_samples: 0                 # 0 uses the full split
  val_samples: 4                   # 0 uses the full validation split

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  task_type: CAUSAL_LM

training:
  output_dir: runs/trajectory-lora
  seed: 42
  max_steps: 20                    # -1 uses num_train_epochs instead
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  optim: adamw_torch
  lr_scheduler_type: constant
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  dataloader_num_workers: 0
  logging_steps: 1
  save_strategy: "no"             # final adapter is saved after training
  report_to: []

  # Required by the custom multimodal collator and loss.
  remove_unused_columns: false
  dataset_kwargs:
    skip_prepare_dataset: true
  max_length: null
  packing: false
  prediction_loss_only: true
  label_names: [labels]
  average_tokens_across_devices: false

# Generation uses recorded human prefixes; it does not execute browser actions.
inference:
  adapter_path: runs/trajectory-lora
  compare_base: true
  max_new_tokens: 256
  do_sample: false

evaluation:
  split: val
  output_dir: runs/evaluation
  max_examples: 12                  # 0: full split; otherwise class-balanced smoke
  position_tolerance: 0.05         # sqrt((dx/width)^2 + (dy/height)^2)
  scroll_tolerance: 0.25           # same normalization for delta_x/delta_y error
  scroll_deadzone_pixels: 1.0
